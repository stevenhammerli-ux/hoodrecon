# Hood Recon website editor (Decap CMS).
# Cannon signs in at hoodreconllc.com/admin and edits each part of the page with simple forms.
# Each "Publish" saves the change and the live site updates in about a minute.

backend:
  name: github
  repo: stevenhammerli-ux/hoodrecon
  branch: main
  base_url: https://api.netlify.com
  commit_messages:
    update: "Update {{slug}} from the website editor"
    uploadMedia: "Upload {{path}}"

site_url: https://hoodreconllc.com
display_url: https://hoodreconllc.com
logo_url: /img/logo-square.jpg
media_folder: img/uploads
public_folder: /img/uploads

collections:
  - name: business
    label: Business info
    description: Your phone, email, hours and social media links. These show up all over the site.
    editor: { preview: true }
    files:
      - name: contact
        label: Phone, email and hours
        file: content/contact.json
        fields:
          - label: Contact info
            name: business
            widget: object
            collapsed: false
            fields:
              - { label: Phone number, name: phone, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: Hours, name: hours, widget: string, hint: "Example: Mon–Sat, 9 AM – 6 PM" }
              - { label: City (shown at the bottom of the page), name: city, widget: string }
              - { label: Tagline (shown at the bottom of the page), name: tagline, widget: string }
          - { label: Heading above your contact info, name: contact_heading, widget: string }

      - name: socials
        label: Social media links
        file: content/socials.json
        fields:
          - label: Social media links
            name: socials
            widget: list
            summary: "{{fields.name}}"
            hint: "Paste the full link. The right icon is picked for you (Instagram, Facebook, Google, YouTube, X, LinkedIn, Pinterest, TikTok). Drag to change the order."
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Link, name: link, widget: string }

  - name: sections
    label: Page sections
    description: Each part of the home page, in the order it appears from top to bottom.
    editor: { preview: true }
    files:
      - name: hero
        label: Top of page (headline and photo)
        file: content/hero.json
        fields:
          - label: Headline and photo
            name: hero
            widget: object
            collapsed: false
            fields:
              - { label: Small line above the headline, name: eyebrow, widget: string }
              - { label: "Headline, first line", name: line1, widget: string }
              - { label: "Headline, second line: amber word", name: line2_highlight, widget: string }
              - { label: "Headline, second line: the rest", name: line2_rest, widget: string }
              - { label: Intro sentence, name: intro, widget: text }
              - { label: Background photo, name: photo, widget: image, hint: "Use a wide photo. Darker photos keep the white text easy to read." }
              - { label: Photo credit (leave blank for your own photos), name: photo_credit, widget: string, required: false }
              - { label: Photo credit link, name: photo_credit_link, widget: string, required: false }
          - label: Quick highlights under the buttons
            name: highlights
            widget: list
            summary: "{{fields.bold}} {{fields.text}}"
            fields:
              - { label: Bold part, name: bold, widget: string }
              - { label: Rest, name: text, widget: string }

      - name: services
        label: What we fix
        file: content/services.json
        fields:
          - { label: Heading, name: services_heading, widget: string }
          - { label: Intro, name: services_intro, widget: text }
          - label: Services
            name: services
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Icon, name: icon, widget: select, default: ding, options: [{ label: "Door ding (circle)", value: ding }, { label: "Crease (curve)", value: crease }, { label: "Hail (dots)", value: hail }, { label: "Bump", value: bump }, { label: "Wrench", value: wrench }, { label: "Car", value: car }] }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: text, widget: text }
          - { label: Note at the bottom, name: services_note, widget: text }

      - name: steps
        label: How it works
        file: content/steps.json
        fields:
          - { label: Heading, name: steps_heading, widget: string }
          - label: Steps
            name: steps
            widget: list
            summary: "{{fields.title}}"
            hint: "The step numbers are added for you."
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: text, widget: text }

      - name: gallery
        label: Photo gallery
        file: content/gallery.json
        fields:
          - { label: Heading, name: work_heading, widget: string }
          - { label: Intro, name: work_intro, widget: text }
          - label: Photos
            name: gallery
            widget: list
            summary: "{{fields.caption}}"
            hint: "Drag to reorder. The first photo shows up biggest. Five photos fill the layout best."
            fields:
              - { label: Photo, name: photo, widget: image }
              - { label: Caption, name: caption, widget: string, required: false }
              - { label: "What's in the photo (helps Google and screen readers)", name: description, widget: string, required: false }

      - name: about
        label: About Cannon
        file: content/about.json
        fields:
          - label: About
            name: about
            widget: object
            collapsed: false
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Bold opening sentence, name: lead, widget: string }
              - { label: Paragraph, name: text, widget: text }
              - { label: Second paragraph, name: text2, widget: text, required: false }
              - { label: Photo, name: photo, widget: image }
              - label: Numbers
                name: stats
                widget: list
                summary: "{{fields.number}} {{fields.label}}"
                fields:
                  - { label: Number, name: number, widget: string }
                  - { label: Label, name: label, widget: string }

      - name: area
        label: Service area
        file: content/area.json
        fields:
          - label: Service area
            name: area
            widget: object
            collapsed: false
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Towns (the first one is highlighted), name: towns, widget: list, field: { label: Town, name: town, widget: string } }

      - name: faq
        label: FAQ
        file: content/faq.json
        fields:
          - label: Questions
            name: faq
            widget: list
            summary: "{{fields.question}}"
            hint: "Drag to reorder. The first question shows open."
            fields:
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: text }

      - name: tips
        label: Photo tips for quotes
        file: content/tips.json
        fields:
          - { label: Tips, name: photo_tips, widget: list, field: { label: Tip, name: tip, widget: string } }
